version: '3.8'

services:
  app-test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - DB_HOST=mysql-test
    ports:
      - "8081:8080"
    depends_on:
      mysql-test:
        condition: service_healthy
    networks:
      - sport-club-network

  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sportclub_test
      MYSQL_ROOT_PASSWORD: testpassword
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - sport-club-network

networks:
  sport-club-network:
    driver: bridge
