
name: Java CI and Docker validation

on:
  push:
    branches: [main, develop, "devops/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven verification
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/jacoco-report/
          if-no-files-found: warn
          retention-days: 7

  docker-build:
    name: Build Docker image and validate Kubernetes YAML
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate Kubernetes manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path("k8s").glob("*.yaml"))
          if not files:
              raise SystemExit("No Kubernetes YAML files found")

          for path in files:
              docs = [
                  doc for doc in yaml.safe_load_all(
                      path.read_text(encoding="utf-8-sig")
                  ) if doc
              ]
              if not docs:
                  raise SystemExit(f"No Kubernetes resources found in {path}")
              print(f"YAML OK: {path} ({len(docs)} resource(s))")
          PY

      - name: Build Docker image
        run: docker build --tag sport-club-management:${{ github.sha }} .
