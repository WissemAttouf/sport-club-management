<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Sport Club'">Sport Club Management</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { padding-top: 56px; }
        /* Vos styles ici */
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">🏆 Sport Club</a>
            <ul class="navbar-nav ms-auto" style="flex-direction: row;">
                <li class="nav-item"><a class="nav-link" th:classappend="${page} == 'home' ? 'active'" href="/">Accueil</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${page} == 'members' ? 'active'" href="/members">Membres</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${page} == 'about' ? 'active'" href="/about">À propos</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${page} == 'activities' ? 'active'" href="/activities">Activités</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${page} == 'contact' ? 'active'" href="/contact">Contact</a></li>
            </ul>
        </div>
    </nav>
    
    <!-- Le contenu sera inséré ici -->
    <div th:insert="${content}"></div>
    
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p>Sport Club Management © 2024</p>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <!-- Scripts spécifiques -->
    <div th:insert="${scripts} ?: ''"></div>
</body>
</html>
