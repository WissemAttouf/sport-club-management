# Docker profile — credentials must be provided through environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sportdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sport_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.h2.console.enabled=false
# Kubernetes health probes
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never