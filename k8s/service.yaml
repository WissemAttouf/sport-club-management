apiVersion: v1
kind: Service
metadata:
  name: sport-club-service
  labels:
    app: sport-club
spec:
  selector:
    app: sport-club
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sport-club-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: sport-club.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sport-club-service
            port:
              number: 80
