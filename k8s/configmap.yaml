apiVersion: v1
kind: ConfigMap
metadata:
  name: sport-club-config
data:
  application.yml: |
    spring:
      datasource:
        url: jdbc:mysql://sport-club-db:3306/sportclub
        username: admin
        driver-class-name: com.mysql.cj.jdbc.Driver
      jpa:
        hibernate:
          ddl-auto: update
        show-sql: true
      flyway:
        enabled: true
    server:
      port: 8080
    logging:
      level:
        com.sportclub: DEBUG
  database.host: "sport-club-db"
