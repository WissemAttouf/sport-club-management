
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sport-club-management
  labels:
    app: sport-club
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sport-club
  template:
    metadata:
      labels:
        app: sport-club
    spec:
      containers:
        - name: sport-club-app
          image: sport-club-management:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080

          # Configuration Spring depuis le ConfigMap
          envFrom:
            - configMapRef:
                name: sport-club-config

          # Identifiants MySQL depuis le Secret
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sport-club-secrets
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sport-club-secrets
                  key: db-password

          resources:
            requests:
              memory: 384Mi
              cpu: 200m
            limits:
              memory: 768Mi
              cpu: 750m

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
